vacancies:
  platforms:
    hh:
      base-url: "https://rabota.by/search/vacancy"
      query-param-names:
        position: "text"
        city: "area"
        experience: "experience"
        employment-type: "employment"
        work-format: "work_format"
      experience-mapping:
        "Без опыта": "noExperience"
        "1-3 года": "between1And3"
        "3-6 лет": "between3And6"
        "Более 6 лет": "moreThan6"
      employment-mapping:
        "Полная занятость": "full"
        "Частичная занятость": "part"
        "Стажировка": "probation"
      work-format-mapping:
        "На месте работодателя": "ON_SITE"
        "Удалённо": "REMOTE"
        "Гибрид": "HYBRID"
      additional-params: "search_field=name&search_field=company_name&search_field=description"