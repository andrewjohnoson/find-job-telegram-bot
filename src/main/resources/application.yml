spring:
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  config:
#    Optional: if exists, we use it, else app doesn't crash
#    file:.env points that spring should search it into the root of project
#    [.properties] makes spring process syntax like default .properties
    import:
      - "optional:file:.env[.properties]"
      - classpath:vacancies.yml
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    embedding:
      transformer:
        cache:
          directory: "./onnx-cache"
        onnx:
          model-uri: "https://huggingface.co/onnx-models/paraphrase-multilingual-MiniLM-L12-v2-onnx/resolve/main/model.onnx"
          model-output-name: token_embeddings
        tokenizer:
          uri: "https://huggingface.co/onnx-models/paraphrase-multilingual-MiniLM-L12-v2-onnx/resolve/main/tokenizer.json?download=true"
bot:
  api:
    token: ${BOT_TOKEN}
