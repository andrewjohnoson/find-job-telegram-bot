plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zhevlakov'
version = '0.0.1-SNAPSHOT'
description = 'find-job-telegram-bot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.0'
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.0'
    implementation 'org.springframework.boot:spring-boot-devtools:4.1.0'
    implementation 'com.github.pengrad:java-telegram-bot-api:10.1.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
